trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
- task: Docker@2
  displayName: Build and push Product API image
  inputs:
    containerRegistry: "Ecommerce"
    repository: "productapi"
    command: "buildAndPush"
    Dockerfile: "$(Build.SourcesDirectory)/ProductAPI/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)"
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Build and push Auth API image
  inputs:
    containerRegistry: "Ecommerce"
    repository: "authapi"
    command: "buildAndPush"
    Dockerfile: "$(Build.SourcesDirectory)/AuthAPI/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)"
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Build and push Cart API image
  inputs:
    containerRegistry: "Ecommerce"
    repository: "cartapi"
    command: "buildAndPush"
    Dockerfile: "$(Build.SourcesDirectory)/CartAPI/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)"
    tags: |
      $(Build.BuildId)

- task: Docker@2
  displayName: Build and push Order API image
  inputs:
    containerRegistry: "Ecommerce"
    repository: "orderapi"
    command: "buildAndPush"
    Dockerfile: "$(Build.SourcesDirectory)/OrderAPI/Dockerfile"
    buildContext: "$(Build.SourcesDirectory)"
    tags: |
      $(Build.BuildId)
